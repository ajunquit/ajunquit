<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Alejandro Junqui — Software Engineer and Platform Builder</title>
  <desc id="desc">Profile banner highlighting .NET, Angular, DevOps, Azure, AWS, Claude and Codex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b35"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#grid)"/>
  <path d="M0 330 C230 250 390 430 640 326 S1010 220 1200 306 V400 H0Z" fill="#38bdf8" opacity=".05"/>
  <rect x="64" y="54" width="96" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="64" y="100" fill="#93c5fd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">SOFTWARE ENGINEER · PLATFORM BUILDER</text>
  <text x="64" y="174" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="800">Alejandro Junqui</text>
  <text x="64" y="222" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25">I build the software behind the software.</text>
  <text x="64" y="258" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19">Architecture → Product → Cloud → Feedback</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="64" y="298" width="116" height="42" rx="21" fill="#7c3aed"/>
    <text x="122" y="325" fill="#ffffff" text-anchor="middle">.NET 10</text>

    <rect x="192" y="298" width="132" height="42" rx="21" fill="#b91c1c"/>
    <text x="258" y="325" fill="#ffffff" text-anchor="middle">ANGULAR 20</text>

    <rect x="336" y="298" width="112" height="42" rx="21" fill="#0369a1"/>
    <text x="392" y="325" fill="#ffffff" text-anchor="middle">DEVOPS</text>

    <rect x="460" y="298" width="154" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".65"/>
    <text x="537" y="325" fill="#e2e8f0" text-anchor="middle">AZURE · AWS</text>

    <rect x="626" y="298" width="184" height="42" rx="21" fill="#14532d" stroke="#4ade80" stroke-opacity=".65"/>
    <text x="718" y="325" fill="#dcfce7" text-anchor="middle">CLAUDE · CODEX</text>
  </g>

  <g transform="translate(918 197)" filter="url(#shadow)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <path d="M0-86 74-43 74 43 0 86-74 43-74-43Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M0-58 50-29 50 29 0 58-50 29-50-29Z" fill="#111c32" stroke="#8b5cf6" stroke-width="2"/>
    <circle r="28" fill="url(#accent)"/>
    <text y="6" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">BUILD</text>

    <circle cx="-118" cy="-82" r="36" fill="#111827" stroke="#8b5cf6" stroke-width="2"/>
    <text x="-118" y="-77" fill="#ddd6fe" font-size="13" font-weight="800" text-anchor="middle">DESIGN</text>
    <path d="M-88-60 -55-37" stroke="#8b5cf6" stroke-width="2"/>

    <circle cx="118" cy="-82" r="36" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="118" y="-77" fill="#bae6fd" font-size="13" font-weight="800" text-anchor="middle">SHIP</text>
    <path d="M88-60 55-37" stroke="#38bdf8" stroke-width="2"/>

    <circle cx="0" cy="132" r="36" fill="#111827" stroke="#22c55e" stroke-width="2"/>
    <text y="137" fill="#bbf7d0" font-size="13" font-weight="800" text-anchor="middle">LEARN</text>
    <path d="M0 86V96" stroke="#22c55e" stroke-width="2"/>
  </g>
</svg>
